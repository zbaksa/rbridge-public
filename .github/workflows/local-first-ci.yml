name: RBridge Local-First CI

on:
  push:
    branches: ['review/**', 'public/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: rbridge-local-first-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rbridge-local-first:
    runs-on: [self-hosted, linux, x64, rbridge]
    timeout-minutes: 20
    steps:
      - name: Verify dedicated runner identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -un)" = "rbridge-ci"
          test "${RUNNER_NAME}" = "rbridge-debian-ci"
          test "${GITHUB_REPOSITORY}" = "zbaksa/rbridge-public"

      - name: Prepare short private temp root
        shell: bash
        run: |
          set -euo pipefail
          test -d /dev/shm
          test -w /dev/shm
          tmp="$(mktemp -d /dev/shm/rbridge-ci.XXXXXX)"
          chmod 700 "$tmp"
          {
            echo "TMPDIR=$tmp"
            echo "TMP=$tmp"
            echo "TEMP=$tmp"
          } >> "$GITHUB_ENV"

      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build server
        run: npm run build:server

      - name: Public-source scrub
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -E '[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+-private|/root/|192\.168\.[0-9]+\.[0-9]+' -- src docs README.md AGENTS.md SECURITY.md upstream; then
            echo "PUBLIC_SCRUB=FAIL" >&2
            exit 1
          fi
          echo "PUBLIC_SCRUB=PASS"

      - name: Verify tracked source stayed clean
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Cleanup private temp root
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$TMPDIR" && "$TMPDIR" == /dev/shm/rbridge-ci.* ]]; then
            rm -rf -- "$TMPDIR"
          fi
