name: RBridge TopPlan W1 Windows Native Host

on:
  push:
    branches: ['topplan/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rbridge-topplan-w1-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-native-host:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify original P01 pristine Native transaction (synthetic Windows)
        shell: pwsh
        run: |
          powershell.exe -NoProfile -NonInteractive -File scripts/test-p01-pristine-native-windows.ps1
          if ($LASTEXITCODE -ne 0) { throw 'P01_PRISTINE_NATIVE_QA_FAILED' }

      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Verify native Windows SSH launch paths
        run: npm run test:ssh-paths

      - name: Verify read-only owner facts under Windows PowerShell 5.1
        shell: pwsh
        run: powershell.exe -NoProfile -NonInteractive -File scripts/test-native-owner-facts-windows.ps1

      - name: Verify first owner setup under Windows PowerShell 5.1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Zip = Join-Path $env:RUNNER_TEMP 'rbridge-qualified-34871a7.zip'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/zbaksa/rbridge-public/releases/download/cocwin-windows-34871a7/rbridge-windows-34871a7.zip' -OutFile $Zip -TimeoutSec 180
          if ((Get-Item -LiteralPath $Zip).Length -ne 34356996) { throw 'QUALIFIED_PACKAGE_SIZE_MISMATCH' }
          if ((Get-FileHash -LiteralPath $Zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '9afb6a22737f3b2d446684240051477096924e55e4d688b5f2feef70e8ef3350') { throw 'QUALIFIED_PACKAGE_SHA_MISMATCH' }
          $UpgradeZip = Join-Path $env:RUNNER_TEMP 'rbridge-qualified-11c6723.zip'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/zbaksa/rbridge-public/releases/download/cocwin-windows-11c6723/rbridge-windows-11c6723.zip' -OutFile $UpgradeZip -TimeoutSec 180
          if ((Get-Item -LiteralPath $UpgradeZip).Length -ne 34357300 -or (Get-FileHash -LiteralPath $UpgradeZip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '0e614e0f143bb49db4e2e2807a9ebde4e6796e5adcf7425ff08762bd240b4af0') { throw 'QUALIFIED_UPGRADE_PACKAGE_INVALID' }
          powershell.exe -NoProfile -NonInteractive -File scripts/test-native-owner-standard-user-windows.ps1 -PackageZip $Zip -UpgradePackageZip $UpgradeZip
          if ($LASTEXITCODE -ne 0) { throw 'STANDARD_USER_SETUP_QA_FAILED' }
          powershell.exe -NoProfile -NonInteractive -File scripts/test-native-owner-setup-windows.ps1 -PackageZip $Zip
          if ($LASTEXITCODE -ne 0) { throw 'OWNER_SETUP_QA_FAILED' }

      - name: Verify portable V3 Native result store
        run: npm run test:v3:native-results

      - name: Verify portable V3 Native transport and runtime
        run: npm run test:v3:native-transport

      - name: Verify portable V3 fixed peer and stdio CLI
        run: npm run test:v3:transport

      - name: Verify current ChatGPT composer and guarded send
        run: npm run test:v3:delivery

      - name: Build and verify Chrome extension
        run: npm run build:extension

      - name: Verify provisioned V3 startup and separate bundle
        run: npm run test:v3:startup && npm run test:v3:startup-bundle

      - name: Build Windows Native Host SEA
        run: npm run build:native-host:sea

      - name: Verify read-only config check and V3 installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node dist/tests/w1-v3-native-install.js
          if ($LASTEXITCODE -ne 0) { throw "NATIVE_CONFIG_CHECK_TEST_FAILED" }
          & scripts/test-native-v3-install-windows.ps1 -SourceExe dist-native-host/rbridge-native-host.exe

      - name: Stage installer
        shell: pwsh
        run: Copy-Item scripts/install-native-host-windows.ps1 dist-native-host/install-native-host-windows.ps1

      - name: Verify Windows artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path dist-native-host/rbridge-native-host.exe -PathType Leaf)) { throw "NATIVE_HOST_EXE_MISSING" }
          if (-not (Test-Path dist-native-host/rbridge-native-host.metadata.json -PathType Leaf)) { throw "NATIVE_HOST_METADATA_MISSING" }
          $m = Get-Content dist-native-host/rbridge-native-host.metadata.json -Raw | ConvertFrom-Json
          if ($m.status -ne "PASS" -or $m.schema -ne "RBRIDGE_NATIVE_HOST_WINDOWS_SEA_V1") { throw "NATIVE_HOST_METADATA_INVALID" }
          Write-Output "WINDOWS_NATIVE_HOST_PACKAGE=PASS SHA256=$($m.sha256)"

      - uses: actions/upload-artifact@v4
        with:
          name: rbridge-native-host-windows-${{ github.sha }}
          path: |
            dist-native-host/rbridge-native-host.exe
            dist-native-host/rbridge-native-host.metadata.json
            dist-native-host/install-native-host-windows.ps1
            dist-extension/manifest.json
            dist-extension/contentScript.js
            dist-extension/serviceWorker.js
          if-no-files-found: error
          retention-days: 7

      - name: Build original P01 owner kit from exact Windows checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import {createHash} from 'node:crypto';
          import {mkdtempSync,readFileSync,writeFileSync} from 'node:fs';
          import {join,resolve} from 'node:path';
          import {spawnSync} from 'node:child_process';
          const need=(ok,code)=>{if(!ok)throw Error(code);};
          const git=args=>{
            const result=spawnSync('git',args,{maxBuffer:1048576});
            need(!result.error&&result.status===0,'P01_CI_GIT_CHECK_FAILED');
            return result.stdout;
          };
          const sha256=bytes=>createHash('sha256').update(bytes).digest('hex');
          const commit=git(['rev-parse','HEAD']).toString('utf8').trim();
          const tree=git(['rev-parse','HEAD^{tree}']).toString('utf8').trim();
          need(/^[a-f0-9]{40}$/.test(commit)&&commit===process.env.GITHUB_SHA,'P01_CI_CHECKOUT_MISMATCH');
          need(/^[a-f0-9]{40}$/.test(tree),'P01_CI_TREE_INVALID');
          need(git(['status','--porcelain','--untracked-files=all']).length===0,'P01_CI_SOURCE_DIRTY');
          const canonicalCommit=git(['cat-file','commit',commit]);
          // Read Windows-native environment paths inside Node; no MSYS path arguments.
          need(process.env.RUNNER_TEMP&&process.env.GITHUB_WORKSPACE,'P01_CI_PATHS_REQUIRED');
          need(resolve(process.cwd())===resolve(process.env.GITHUB_WORKSPACE),'P01_CI_WORKSPACE_MISMATCH');
          const proofRoot=mkdtempSync(join(resolve(process.env.RUNNER_TEMP),'p01-owner-proof-'));
          const sourceProofPath=join(proofRoot,'source-proof.json');
          const nativeProofPath=join(proofRoot,'native-proof.json');
          const nativeExecutable=resolve('dist-native-host/rbridge-native-host.exe');
          const nativeMetadata=resolve('dist-native-host/rbridge-native-host.metadata.json');
          const executableBytes=readFileSync(nativeExecutable);
          const metadataBytes=readFileSync(nativeMetadata);
          writeFileSync(sourceProofPath,JSON.stringify({
            schema:'COCWIN_P01_CANONICAL_SOURCE_PROOF_V1',
            appCommit:commit,canonicalCommit:commit,tree,
            canonicalCommitBase64:canonicalCommit.toString('base64'),
          })+'\n',{flag:'wx'});
          // The checkout binds these actual SEA bytes to source; metadata has no source fields.
          writeFileSync(nativeProofPath,JSON.stringify({
            schema:'COCWIN_P01_NATIVE_ARTIFACT_PROOF_V1',
            sourceCommit:commit,sourceTree:tree,
            bytes:executableBytes.length,sha256:sha256(executableBytes),
            metadataSha256:sha256(metadataBytes),
          })+'\n',{flag:'wx'});
          const build=spawnSync(process.execPath,[
            'scripts/p01-owner-v3-kit.mjs',
            '--source-proof',sourceProofPath,'--native-proof',nativeProofPath,
            '--native-executable',nativeExecutable,'--native-metadata',nativeMetadata,
          ],{stdio:'inherit'});
          need(!build.error&&build.status===0,'P01_CI_OWNER_KIT_BUILD_FAILED');
          NODE

      - name: Upload original P01 pristine owner kit
        uses: actions/upload-artifact@v4
        with:
          name: cocwin-p01-pristine-owner-${{ github.sha }}
          path: dist-p01-owner-v3-kit/
          if-no-files-found: error
          retention-days: 7

  publish-qualified-windows-package:
    needs: windows-native-host
    if: github.event_name == 'push' && github.repository == 'zbaksa/rbridge-public' && github.ref == 'refs/heads/topplan/cocwin092-windows-owner-setup-r1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'

      - name: Verify publication expiry and conflicting-tag regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --location --silent --show-error --max-time 180 'https://github.com/zbaksa/rbridge-public/releases/download/cocwin-windows-34871a7/rbridge-windows-34871a7.zip' --output "$RUNNER_TEMP/rbridge-qualified-34871a7.zip"
          node scripts/test-qualified-windows-publication.mjs "$RUNNER_TEMP/rbridge-qualified-34871a7.zip"

      - name: Publish or verify the exact qualified archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-qualified-windows-package.sh
